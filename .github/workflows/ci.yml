name: Build and Test

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    name: Build and Test (JDK ${{ matrix.java }})
    strategy:
      matrix:
        java: [ '8', '11', '17', '21', '25' ]

    steps:
    - name: Checkout repository
      # Using v4 - de0fac2e4500dabe0009e67214ff5f5447ce83dd
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

    - name: Set up JDK 25 (for building)
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'

    - name: Set up JDK ${{ matrix.java }} (for testing)
      if: matrix.java != '25'
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'

    - name: Build and Test with Maven
      shell: bash
      run: |
        if [ "${{ matrix.java }}" == "25" ]; then
          mvn -B clean verify
        else
          # Use the matrix JDK for testing via surefire's jvm parameter
          # We need to find the path to the matrix JDK. setup-java sets JAVA_HOME.
          # When we setup 25 then matrix.java, JAVA_HOME points to matrix.java.
          mvn -B clean verify -Dsurefire.jvm="$JAVA_HOME/bin/java"
        fi

    - name: Upload coverage to Codecov
      if: matrix.java == '17' || matrix.java == '25'
      # Using v5 - 57e3a136b779b570ffcdbf80b3bdc90e7fab3de2
      uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2
      with:
        files: target/site/jacoco/jacoco.xml
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }}

  pages:
    # Deploy Javadocs only on push to master/main and after build success
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Generate Javadoc
        run: mvn javadoc:javadoc

      - name: Prepare Pages Source
        run: |
          mkdir -p _pages_src/docs
          # Add Jekyll Front Matter to README so it renders with the theme
          echo -e "---\nlayout: default\n---\n" > _pages_src/index.md
          cat README.md >> _pages_src/index.md
          
          # Add Front Matter to all other docs
          for f in docs/*.md; do
            filename=$(basename "$f")
            echo -e "---\nlayout: default\n---\n" > "_pages_src/docs/$filename"
            cat "$f" >> "_pages_src/docs/$filename"
          done

          # Create a basic _config.yml to use a nice theme
          echo "theme: jekyll-theme-minimal" > _pages_src/_config.yml
          echo "title: JDivert" >> _pages_src/_config.yml
          echo "description: Java bindings for WinDivert" >> _pages_src/_config.yml

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./_pages_src
          destination: ./_site

      - name: Add Javadoc to Site
        run: |
          # Copy the generated Javadoc into the Jekyll output directory
          # This bypasses Jekyll processing for the large number of Javadoc files
          cp -r docs/api _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0 
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
