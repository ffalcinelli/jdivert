name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SONATYPE_USERNAME: ${{ secrets.SONATYPE_PORTAL_TOKEN_USERNAME }}
      SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PORTAL_TOKEN_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '25'
          distribution: 'temurin'
          server-id: central
          server-username: SONATYPE_USERNAME
          server-password: SONATYPE_PASSWORD

      - name: Import GPG key
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          # GnuPG exits with code 2 on minor warnings (like 'invalid armor header' caused by trailing newlines in secrets),
          # even when the key is successfully imported. We pipe it from an env var to avoid escaping issues
          # and append '|| true' to bypass the strict exit code check, then verify the import.
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import || echo "GPG import yielded warnings, but continuing..."
          gpg --list-secret-keys

      - name: Publish to Maven Central
        shell: bash
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn --batch-mode deploy -P release -DskipTests -Dgpg.passphrase="$GPG_PASSPHRASE"

      - name: Create GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            target/*.jar \
            --repo="$GITHUB_REPOSITORY" \
            --title="Release ${{ github.ref_name }}" \
            --generate-notes
