name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MAVEN_USERNAME: ${{ secrets.SONATYPE_PORTAL_TOKEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.SONATYPE_PORTAL_TOKEN_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up JDK 25
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          java-version: '25'
          distribution: 'temurin'
          server-id: sonatype-central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Import GPG key
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          # GnuPG exits with code 2 on minor warnings (like 'invalid armor header' caused by trailing newlines in secrets),
          # even when the key is successfully imported. We pipe it from an env var to avoid escaping issues
          # and append '|| true' to bypass the strict exit code check, then verify the import.
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import || echo "GPG import yielded warnings, but continuing..."
          gpg --list-secret-keys

      - name: Publish to Maven Central
        shell: bash
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn --batch-mode deploy -P release -DskipTests

      - name: Create GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            target/*.jar \
            --repo="$GITHUB_REPOSITORY" \
            --title="Release ${{ github.ref_name }}" \
            --generate-notes
